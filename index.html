<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ANIMAL SAMPLE — The Lab Run</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1114;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:auto}
.hint{position:fixed;left:14px;bottom:10px;opacity:.6;font-size:12px;pointer-events:none}
.touch{display:none;position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:10}
.touch button{pointer-events:auto;width:72px;height:72px;border:2px solid rgba(255,255,255,.35);border-radius:18px;background:rgba(15,23,25,.72);color:#fff;font-size:30px;font-weight:800;touch-action:none;-webkit-user-select:none;user-select:none}
.touch .left{position:absolute;left:18px;bottom:24px}
.touch .right{position:absolute;left:104px;bottom:24px}
.touch .jump{position:absolute;right:18px;bottom:24px;width:92px}
@media (pointer:coarse), (max-width:900px){
  .touch{display:block}
  .hint{display:none}
}
</style></head>
<body><canvas id="game"></canvas>
<div class="hint">A/D oder ←/→ · Springen: W/↑/Leertaste · E: Interaktion · P: Pause · R: Neustart</div>
<div class="touch" aria-label="Touch-Steuerung">
  <button class="left" id="touchLeft" aria-label="Nach links">◀</button>
  <button class="right" id="touchRight" aria-label="Nach rechts">▶</button>
  <button class="jump" id="touchJump" aria-label="Springen">JUMP</button>
